name: One-time signing recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-encrypted-backup:
    runs-on: windows-latest
    steps:
      - name: Build encrypted recovery bundle
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RECOVERY_PASSWORD: ${{ secrets.RECOVERY_EXPORT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'KEYSTORE_B64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD','RECOVERY_PASSWORD') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw "Required recovery input is missing: $name"
            }
          }

          $work = Join-Path $env:RUNNER_TEMP 'sudoku-buddy-signing-recovery'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $keystore = Join-Path $work 'sudoku-buddy-release.jks'
          $credentials = Join-Path $work 'credentials.json'
          $archive = Join-Path $env:RUNNER_TEMP 'signing-material.zip'
          $encrypted = Join-Path $env:RUNNER_TEMP 'sudoku-buddy-signing-backup.sbkey'

          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_B64))
            @{
              keystorePassword = $env:KEYSTORE_PASSWORD
              keyAlias = $env:KEY_ALIAS
              keyPassword = $env:KEY_PASSWORD
            } | ConvertTo-Json | Set-Content -LiteralPath $credentials -Encoding utf8NoBOM
            Compress-Archive -LiteralPath $keystore,$credentials -DestinationPath $archive -Force

            $salt = New-Object byte[] 16
            $nonce = New-Object byte[] 12
            [Security.Cryptography.RandomNumberGenerator]::Fill($salt)
            [Security.Cryptography.RandomNumberGenerator]::Fill($nonce)
            $derive = [Security.Cryptography.Rfc2898DeriveBytes]::new(
              $env:RECOVERY_PASSWORD,
              $salt,
              200000,
              [Security.Cryptography.HashAlgorithmName]::SHA256
            )
            $key = $derive.GetBytes(32)
            $plaintext = [IO.File]::ReadAllBytes($archive)
            $ciphertext = New-Object byte[] $plaintext.Length
            $tag = New-Object byte[] 16
            $aes = [Security.Cryptography.AesGcm]::new($key, 16)
            $aes.Encrypt($nonce, $plaintext, $ciphertext, $tag)

            $magic = [Text.Encoding]::ASCII.GetBytes('SBKEY001')
            $output = New-Object byte[] ($magic.Length + $salt.Length + $nonce.Length + $tag.Length + $ciphertext.Length)
            $offset = 0
            foreach ($part in $magic,$salt,$nonce,$tag,$ciphertext) {
              [Array]::Copy($part, 0, $output, $offset, $part.Length)
              $offset += $part.Length
            }
            [IO.File]::WriteAllBytes($encrypted, $output)
            "RECOVERY_BUNDLE=$encrypted" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $work,$archive -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Variable key,plaintext,ciphertext -ErrorAction SilentlyContinue
          }

      - name: Upload encrypted recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-buddy-signing-recovery
          path: ${{ env.RECOVERY_BUNDLE }}
          if-no-files-found: error
          retention-days: 1
