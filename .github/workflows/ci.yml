name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Corpus photographs are not in the repository, so every test that needs one
      # skips here. That is expected: see docs/superpowers/plans.
      - name: Build and test
        run: ./gradlew build --console=plain

      # Without this the release is signed with a debug key generated on this runner,
      # which differs from the one the last runner made - and testers cannot update
      # across a signature change, they have to uninstall and lose everything.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; this release cannot be distributed."
          fi

      - name: Assemble release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # Play refuses native libraries built for 4 KB pages, and they do not fail
      # gracefully - they fail to load on a 16 KB device, which is a phone no build here
      # runs on. The check reads the ELF headers, so it catches a dependency regressing.
      - name: Check the native libraries are 16 KB aligned
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:checkNativeAlignment --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-buddy-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # What Play takes. The APK above stays for Firebase, which wants one file for one
      # ABI; the bundle carries all four and lets Play send each phone only its own.
      - name: Assemble the Play bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-buddy-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  distribute:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The app id is committed, so the only thing CI is missing is a credential.
      # Either kind works; FIREBASE_TOKEN is far easier to obtain.
      - name: Check a Firebase credential is configured
        id: firebase
        env:
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No FIREBASE_APP_ID for org.freevia.sudokubuddy, so this build was not distributed."
            echo "::warning::Register the new package in Firebase and set the FIREBASE_APP_ID secret."
          elif [ -n "$TOKEN" ]; then
            echo "kind=token" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "kind=key" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No Firebase credential, so this build was not distributed."
            echo "::warning::Set FIREBASE_TOKEN (run: firebase login:ci) or FIREBASE_SERVICE_ACCOUNT."
            echo "::warning::See docs/firebase-distribution.md."
          fi

      # The release that reaches testers must carry the same signature every time, or
      # each build arrives as an uninstall and takes their puzzles with it.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the upload will refuse to run."
          fi

      # A refresh token from `firebase login:ci`. Needs no Google Cloud console access.
      - name: Distribute using a Firebase token
        if: steps.firebase.outputs.kind == 'token'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease appDistributionUploadRelease --console=plain

      - name: Distribute using a service account
        if: steps.firebase.outputs.kind == 'key'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"
          export FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase-key.json"
          ./gradlew :app:assembleRelease appDistributionUploadRelease --console=plain
          rm -f "$RUNNER_TEMP/firebase-key.json"
